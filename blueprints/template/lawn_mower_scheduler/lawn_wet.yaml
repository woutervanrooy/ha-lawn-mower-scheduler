blueprint:
  name: Lawn wet
  description: >-
    Estimates wet grass from recent rain, high humidity (a simple dew proxy),
    optional irrigation activity and optional mower-reported rain. After wetting
    ends, a drying delay must pass before the lawn is dry.
    Configure this template blueprint in YAML.
  domain: template
  source_url: https://github.com/woutervanrooy/ha-lawn-mower-scheduler/blob/main/blueprints/template/lawn_mower_scheduler/lawn_wet.yaml
  homeassistant:
    min_version: "2024.11.0"
  input:
    sensors:
      name: Sensors
      input:
        rain_sensor:
          name: Rain in the last hour
          description: Rainfall total in mm over the last hour, not an instantaneous rain rate.
          selector:
            entity:
              domain: sensor
        humidity_sensor:
          name: Relative humidity
          description: Relative humidity in percent, used to estimate dew.
          selector:
            entity:
              domain: sensor
              device_class: humidity
        irrigation_entity:
          name: Irrigation activity (optional)
          description: An on/off activity entity or an open/closed irrigation valve.
          default: []
          selector:
            entity:
              domain:
                - switch
                - input_boolean
                - binary_sensor
                - valve
        mower_rain_sensor:
          name: Mower rain sensor (optional)
          description: An on/off rain sensor reported by the mower. Leave empty to ignore.
          default: []
          selector:
            entity:
              domain: binary_sensor
    drying:
      name: Wet grass and drying
      collapsed: true
      input:
        rain_threshold:
          name: Rain threshold
          description: Default 0.5 mm. Lower values also count lighter rain as wetting.
          default: 0.5
          selector:
            number:
              min: 0.1
              max: 20
              step: 0.1
              mode: box
              unit_of_measurement: mm
        dew_humidity:
          name: Dew humidity threshold
          description: Default 92 percent. Lower values treat more humid weather as wet grass.
          default: 92
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: box
              unit_of_measurement: "%"
        drying_hours:
          name: Drying time
          description: Default 3 hours after all wetting stops. Higher values wait longer.
          default: 3
          selector:
            number:
              min: 0
              max: 24
              step: 0.5
              mode: box
              unit_of_measurement: h

variables:
  rain_sensor: !input rain_sensor
  humidity_sensor: !input humidity_sensor
  irrigation_entity: !input irrigation_entity
  mower_rain_sensor: !input mower_rain_sensor
  rain_threshold: !input rain_threshold
  dew_humidity: !input dew_humidity

binary_sensor:
  name: Lawn Wet
  device_class: moisture
  icon: mdi:weather-pouring
  availability: >-
    {{ is_number(states(rain_sensor)) and is_number(states(humidity_sensor))
       and (not irrigation_entity or states(irrigation_entity) in ['on', 'off', 'open', 'closed', 'opening', 'closing'])
       and (not mower_rain_sensor or states(mower_rain_sensor) in ['on', 'off']) }}
  state: >-
    {{ states(rain_sensor) | float(0) >= rain_threshold
       or states(humidity_sensor) | float(0) >= dew_humidity
       or (irrigation_entity and states(irrigation_entity) in ['on', 'open', 'opening', 'closing'])
       or (mower_rain_sensor and is_state(mower_rain_sensor, 'on')) }}
  delay_off:
    hours: !input drying_hours
