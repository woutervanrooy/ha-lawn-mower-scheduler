blueprint:
  name: Lawn frozen
  description: >-
    Estimates frozen grass from air temperature and an optional ground sensor.
    Either cold reading blocks mowing; every configured source must thaw before
    the off delay starts. Between thresholds, retain the previous state.
    Configure this template blueprint in YAML.
  domain: template
  # source_url: https://github.com/OWNER/REPOSITORY/blob/main/blueprints/template/lawn_mower_scheduler/lawn_frozen.yaml
  homeassistant:
    min_version: "2024.11.0"
  input:
    sensors:
      name: Sensors
      input:
        temperature_sensor:
          name: Air temperature
          description: Current air temperature in Celsius.
          selector:
            entity:
              domain: sensor
              device_class: temperature
        ground_temperature_sensor:
          name: Ground temperature (optional)
          description: Ground or grass temperature in Celsius. Leave empty for air-only detection.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
    frost:
      name: Frost and thaw
      collapsed: true
      input:
        air_frost_temperature:
          name: Air frost temperature
          description: Default 3 Celsius. At or below this, grass may be frozen.
          default: 3
          selector:
            number:
              min: -15
              max: 15
              step: 0.5
              mode: box
              unit_of_measurement: "\u00b0C"
        ground_frost_temperature:
          name: Ground frost temperature
          description: Default 1 Celsius. At or below this, grass may be frozen.
          default: 1
          selector:
            number:
              min: -15
              max: 15
              step: 0.5
              mode: box
              unit_of_measurement: "\u00b0C"
        air_thaw_temperature:
          name: Air thaw temperature
          description: Default 5 Celsius. Must exceed the air frost threshold.
          default: 5
          selector:
            number:
              min: -10
              max: 25
              step: 0.5
              mode: box
              unit_of_measurement: "\u00b0C"
        ground_thaw_temperature:
          name: Ground thaw temperature
          description: Default 3 Celsius. Must exceed the ground frost threshold.
          default: 3
          selector:
            number:
              min: -10
              max: 25
              step: 0.5
              mode: box
              unit_of_measurement: "\u00b0C"
        thaw_hours:
          name: Thaw time
          description: Default 2 hours after all configured sources reach their thaw thresholds.
          default: 2
          selector:
            number:
              min: 0
              max: 24
              step: 0.5
              mode: box
              unit_of_measurement: h

variables:
  temperature_sensor: !input temperature_sensor
  ground_temperature_sensor: !input ground_temperature_sensor
  air_frost_temperature: !input air_frost_temperature
  ground_frost_temperature: !input ground_frost_temperature
  air_thaw_temperature: !input air_thaw_temperature
  ground_thaw_temperature: !input ground_thaw_temperature

binary_sensor:
  name: Lawn Frozen
  device_class: cold
  icon: mdi:snowflake
  availability: >-
    {{ is_number(states(temperature_sensor))
       and (not ground_temperature_sensor or is_number(states(ground_temperature_sensor))) }}
  state: >-
    {% if air_thaw_temperature <= air_frost_temperature
          or (ground_temperature_sensor and ground_thaw_temperature <= ground_frost_temperature) %}
      {{ none }}
    {% else %}
      {% set air = states(temperature_sensor) | float(0) %}
      {% set ground = states(ground_temperature_sensor) | float(0) if ground_temperature_sensor else none %}
      {% if air <= air_frost_temperature or (ground is not none and ground <= ground_frost_temperature) %}
        true
      {% elif air >= air_thaw_temperature and (ground is none or ground >= ground_thaw_temperature) %}
        false
      {% else %}
        {{ this.state != 'off' }}
      {% endif %}
    {% endif %}
  delay_off:
    hours: !input thaw_hours
  attributes:
    configuration_error: >-
      {% if air_thaw_temperature <= air_frost_temperature %}
        Air thaw temperature must exceed air frost temperature.
      {% elif ground_temperature_sensor and ground_thaw_temperature <= ground_frost_temperature %}
        Ground thaw temperature must exceed ground frost temperature.
      {% else %}
        {{ '' }}
      {% endif %}
