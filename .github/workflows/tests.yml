name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --junitxml=test-results.xml

      - name: Write test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("test-results.xml")
          if not path.exists():
              print("### Tests\n\nNo test results were produced.")
              raise SystemExit
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = total - failed - skipped
          icon = "✅" if failed == 0 else "❌"
          print(f"### {icon} Tests\n")
          print("| Passed | Failed | Skipped | Total |")
          print("| ---: | ---: | ---: | ---: |")
          print(f"| {passed} | {failed} | {skipped} | {total} |")
          if failed:
              print("\n#### Failures\n")
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print(f"- `{case.get('classname')}::{case.get('name')}`")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
