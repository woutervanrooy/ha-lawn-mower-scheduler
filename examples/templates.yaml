# Copy to packages/lawn_conditions.yaml and select your own source sensors.
# Do not also uncomment the same instances in packages/lawn_mower.yaml.
template:
  - use_blueprint:
      path: lawn_mower_scheduler/lawn_growth_index.yaml
      input:
        temperature_sensor: sensor.outdoor_temperature
        # irradiation_sensor: sensor.irradiation_24h
        # soil_moisture_sensor: sensor.soil_moisture
        # bucket_sensor: sensor.soil_water_bucket
        # bucket_attribute: ""  # Read the state instead of a bucket attribute.
        # dry_soil_percent: 15
        # moist_soil_percent: 30
    name: Lawn Growth Index
    unique_id: lawn_growth_index

  - use_blueprint:
      path: lawn_mower_scheduler/lawn_wet.yaml
      input:
        rain_sensor: sensor.rain_last_hour
        humidity_sensor: sensor.outdoor_humidity
        # irrigation_entity: switch.lawn_irrigation
        # mower_rain_sensor: binary_sensor.mower_rain
        # rain_threshold: 0.5
        # dew_humidity: 92
        # drying_hours: 3
    name: Lawn Wet
    unique_id: lawn_wet

  - use_blueprint:
      path: lawn_mower_scheduler/lawn_frozen.yaml
      input:
        temperature_sensor: sensor.outdoor_temperature
        # ground_temperature_sensor: sensor.ground_temperature
        # air_frost_temperature: 3
        # ground_frost_temperature: 1
        # air_thaw_temperature: 5
        # ground_thaw_temperature: 3
        # thaw_hours: 2
    name: Lawn Frozen
    unique_id: lawn_frozen
