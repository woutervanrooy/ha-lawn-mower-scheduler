# Alternative to creating the conditions automation in the automation UI.
# Copy to packages/lawn_conditions.yaml and select your own source sensors.
automation:
  - id: lawn_mower_lawn_conditions
    alias: Lawn mower - Lawn conditions
    use_blueprint:
      path: lawn_mower_scheduler/lawn_conditions.yaml
      input:
        temperature_sensor: sensor.outdoor_temperature
        rain_sensor: sensor.rain_last_hour
        humidity_sensor: sensor.outdoor_humidity
