# Support entities for one mower. Contains no personal settings: select your
# sensors and tune behavior in the two automation blueprints.
# Setup: https://github.com/woutervanrooy/ha-lawn-mower-scheduler#install
# Replace the old lawn-mower package; do not load both packages together.

input_select:
  lawn_mower_mode:
    name: "Lawn - Mowing mode"
    options:
      - Auto
      - Always daily
      - Disabled
    icon: mdi:robot-mower

input_datetime:
  lawn_mower_last_started:
    name: "Lawn - Last started mow"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock
  lawn_mower_last_completed:
    name: "Lawn - Last completed mow"
    has_date: true
    has_time: true
    icon: mdi:calendar-check

sensor:
  - platform: statistics
    name: Lawn Growth Index 72h
    unique_id: 60cf8b32-0d87-4ccf-ab01-5ee7d9313b1e
    entity_id: sensor.lawn_growth_index
    state_characteristic: mean
    max_age:
      hours: 72
    sampling_size: 100000
    keep_last_sample: true
    precision: 1

template:
  - sensor:
      - name: Lawn Days Between Mows
        unique_id: lawn_days_between_mows
        unit_of_measurement: d
        state_class: measurement
        icon: mdi:calendar-arrow-right
        availability: >-
          {{ states('input_select.lawn_mower_mode') in ['Auto', 'Always daily', 'Disabled'] }}
        state: >-
          {% set mode = states('input_select.lawn_mower_mode') %}
          {% set index = states('sensor.lawn_growth_index_72h') | float(0) %}
          {% if mode == 'Disabled' %}
            0
          {% elif mode == 'Always daily' %}
            1
          {% elif index < 20 %}
            7
          {% elif index < 40 %}
            4
          {% elif index < 60 %}
            3
          {% elif index < 80 %}
            2
          {% else %}
            1
          {% endif %}
        attributes:
          growth_average_available: >-
            {{ is_number(states('sensor.lawn_growth_index_72h')) }}

  # Lawn conditions are calculated by the "Lawn conditions" automation
  # blueprint, which holds all sensor selections and settings. These entities
  # only store the published results and restore them after a restart.
  - trigger:
      - platform: event
        event_type: lawn_mower_scheduler_growth
    sensor:
      - name: Lawn Growth Index
        unique_id: lawn_growth_index
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:sprout
        availability: "{{ trigger.event.data.get('available', false) }}"
        state: "{{ trigger.event.data.get('index') }}"

  - trigger:
      - platform: event
        event_type: lawn_mower_scheduler_wet
    binary_sensor:
      - name: Lawn Wet
        unique_id: lawn_wet
        device_class: moisture
        icon: mdi:weather-pouring
        availability: "{{ trigger.event.data.get('available', false) }}"
        state: "{{ trigger.event.data.get('wet', true) }}"
        attributes:
          wetting: "{{ trigger.event.data.get('wetting') }}"
          wetting_causes: "{{ trigger.event.data.get('wetting_causes', []) }}"
          dry_at: "{{ trigger.event.data.get('dry_at') }}"

  - trigger:
      - platform: event
        event_type: lawn_mower_scheduler_frozen
    binary_sensor:
      - name: Lawn Frozen
        unique_id: lawn_frozen
        device_class: cold
        icon: mdi:snowflake
        availability: "{{ trigger.event.data.get('available', false) }}"
        state: "{{ trigger.event.data.get('frozen', true) }}"
        attributes:
          freezing: "{{ trigger.event.data.get('freezing') }}"
          freezing_causes: "{{ trigger.event.data.get('freezing_causes', []) }}"
          thaw_at: "{{ trigger.event.data.get('thaw_at') }}"
          configuration_error: "{{ trigger.event.data.get('configuration_error', '') }}"
